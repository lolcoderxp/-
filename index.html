<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Chat UI - Swapped Actions</title>
  <link href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css" rel="stylesheet" />
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Vazirmatn', -apple-system, sans-serif;
      -webkit-tap-highlight-color: transparent;
      -webkit-user-select: none;
      -moz-user-select: none;
      -ms-user-select: none;
      user-select: none;
    }

    body {
      background-color: #f6f6f8;
      height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 16px;
      overflow: hidden;
    }

    .main-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      flex-grow: 1;
    }

    .connection-wrapper {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: space-between;
      width: 210px;
      height: 70px;
      margin-bottom: 28px;
    }

    .avatar-circle {
      width: 56px;
      height: 56px;
      background: #ffffff;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.06);
      z-index: 2;
    }

    .connecting-track {
      position: absolute;
      left: 24px;
      right: 24px;
      top: 50%;
      height: 24px;
      transform: translateY(-50%);
      border-top: 1.5px dashed #e1e1e6;
      border-bottom: 1.5px dashed #e1e1e6;
      border-radius: 50%;
      z-index: 1;
    }

    .red-dash-top {
      position: absolute;
      top: -2.5px;
      right: 36px;
      width: 22px;
      height: 3.5px;
      background-color: #e04b43;
      border-radius: 2px;
    }

    .red-dash-bottom {
      position: absolute;
      bottom: -2.5px;
      left: 42px;
      width: 26px;
      height: 3.5px;
      background-color: #e04b43;
      border-radius: 2px;
    }

    .hero-title {
      font-size: 36px;
      font-weight: 900;
      color: #0f0f14;
      text-align: center;
      line-height: 1.25;
      letter-spacing: -0.8px;
    }

    /* --- Bottom Input Card --- */
    .input-card {
      background: #ffffff;
      border: 1.5px dashed #d1d1d6;
      border-radius: 32px;
      padding: 16px 18px;
      display: flex;
      flex-direction: column;
      gap: 20px;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.02);
    }

    .placeholder-text {
      color: #8e8e93;
      font-size: 16px;
      font-weight: 500;
      text-align: right;
    }

    /* چیدمان جدید دکمه‌ها - معکوس شده */
    .input-actions {
      display: flex;
      flex-direction: row;
      justify-content: space-between;
      align-items: center;
      width: 100%;
    }

    .left-buttons {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .btn-add {
      width: 44px;
      height: 44px;
      background: #f2f2f7;
      border: none;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 22px;
      color: #1c1c1e;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .btn-add:active {
      transform: scale(0.92);
      background: #e5e5ea;
    }

    .btn-pill {
      background: #f2f2f7;
      color: #1c1c1e;
      border: none;
      border-radius: 22px;
      padding: 10px 18px;
      font-size: 14px;
      font-weight: 800;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .btn-pill:active {
      transform: scale(0.95);
      background: #e5e5ea;
    }

    .btn-send {
      width: 46px;
      height: 46px;
      background: #000000;
      color: #ffffff;
      border: none;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .btn-send:active {
      transform: scale(0.90);
      background: #2c2c2e;
    }

    .btn-send svg {
      width: 22px;
      height: 22px;
    }

    /* Responsive adjustments */
    @media (max-width: 480px) {
      body {
        padding: 12px;
      }
      
      .hero-title {
        font-size: 28px;
      }
      
      .btn-pill {
        font-size: 12px;
        padding: 8px 14px;
      }
      
      .btn-add {
        width: 38px;
        height: 38px;
        font-size: 18px;
      }
      
      .btn-send {
        width: 40px;
        height: 40px;
      }
      
      .btn-send svg {
        width: 18px;
        height: 18px;
      }
    }
  </style>
</head>
<body oncontextmenu="return false;">

  <div class="main-container">
    <div class="connection-wrapper">
      <div class="avatar-circle">
        <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#e67e22" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <path d="M22 12A10 10 0 1 1 12 2a10 10 0 0 1 10 10z"/>
          <path d="M12 6a6 6 0 1 1-6 6 6 6 0 0 1 6-6z"/>
          <path d="M12 9a3 3 0 1 1-3 3 3 3 0 0 1 3-3z"/>
        </svg>
      </div>

      <div class="connecting-track">
        <span class="red-dash-top"></span>
        <span class="red-dash-bottom"></span>
      </div>

      <div class="avatar-circle">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#e04b43" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
          <circle cx="12" cy="7" r="4"/>
        </svg>
      </div>
    </div>

    <h1 class="hero-title">
      چطور می‌تونم کمکت<br>کنم؟
    </h1>
  </div>

  <div class="input-card">
    <div class="placeholder-text">سوالت رو اینجا بپرس...</div>
    <div class="input-actions">
      <!-- دکمه ارسال (در سمت راست قرار می‌گیرد - معکوس شده) -->
      <button class="btn-send">
        <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M16.2116 8.84823C16.5061 8.55696 16.5087 8.0821 16.2174 7.78758C15.9262 7.49307 15.4513 7.49044 15.1568 7.78171L16.2116 8.84823ZM10.6626 14.336L16.2116 8.84823L15.1568 7.78171L9.60787 13.2695L10.6626 14.336Z" fill="#ffffff"></path>
          <path d="M18.6357 15.6701C17.4255 19.3008 16.8204 21.1161 15.933 21.6319C15.0889 22.1227 14.0463 22.1227 13.2022 21.6319C12.3148 21.1161 11.7097 19.3008 10.4995 15.6701C10.3052 15.0872 10.208 14.7957 10.0449 14.5521C9.88687 14.316 9.68404 14.1131 9.44793 13.9551C9.2043 13.792 8.91282 13.6948 8.32987 13.5005C4.69923 12.2903 2.88392 11.6852 2.36806 10.7978C1.87731 9.95369 1.87731 8.91112 2.36806 8.06698C2.88392 7.17964 4.69923 6.57453 8.32987 5.36432M20.0257 11.5L20.3521 10.5208C21.8516 6.02242 22.6013 3.77322 21.414 2.58595C20.2268 1.39869 17.9776 2.14842 13.4792 3.64788L12.4228 4" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round"></path>
        </svg>
      </button>

      <!-- دکمه‌های افزودن و نوروکیس (در سمت چپ قرار می‌گیرند - معکوس شده) -->
      <div class="left-buttons">
        <button class="btn-add">+</button>
        <button class="btn-pill">نوروکیس لایت</button>
      </div>
    </div>
  </div>

</body>
</html>
